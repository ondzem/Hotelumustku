# Nastavení buildu pro Netlify.
#
# Schválně v repozitáři, ne jen v jejich webovém rozhraní: při přepojení
# repozitáře se nastavení v rozhraní vymazalo (build příkaz i složka
# zůstaly prázdné) a Netlify pak publikoval nesestavený repozitář —
# web odkazoval na /src/main.js, který na produkci neexistuje.
# Soubor v repozitáři tohle přežije.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
